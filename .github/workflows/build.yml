name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build libcriterion-dev

      - name: Configure
        run: cmake -G Ninja -B build -DTEST=ON

      - name: Build
        run: ninja -C build

      - name: Test
        run: ./build/cretro_test
